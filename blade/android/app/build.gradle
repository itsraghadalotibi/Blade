plugins {
    id "com.android.application"
    id "kotlin-android"
    id 'com.google.gms.google-services' // Firebase services
    id "dev.flutter.flutter-gradle-plugin" // Flutter Gradle Plugin
}

android {
    namespace = "com.example.blade"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.example.blade"
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = 1
        versionName = "1.0"
        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

// Add your dependencies here
dependencies {
    implementation platform('com.google.firebase:firebase-bom:32.0.0') // Adjust version as needed
    implementation 'com.google.firebase:firebase-analytics-ktx' // Example Firebase library
    implementation 'com.google.firebase:firebase-auth-ktx' // Example Firebase Auth library
    implementation 'com.google.android.material:material:1.8.0' // Example Material Components library
    // Add other dependencies as needed
}
