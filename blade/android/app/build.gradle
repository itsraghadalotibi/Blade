plugins {
    id "com.android.application"
    id "kotlin-android"
    id 'com.google.gms.google-services' // Firebase services
    id "dev.flutter.flutter-gradle-plugin" // Flutter Gradle Plugin
}

android {
    namespace = "com.example.blade"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.example.blade"
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = 1
        versionName = "1.0"
        multiDexEnabled true

        // Add ABI filters to ensure compatibility with different architectures
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }
    buildTypes {
        release {
            // Enable code shrinking (minification) and resource shrinking
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Optional: Disable shrinking for debug builds to speed up development
            minifyEnabled false
            shrinkResources false
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

flutter {
    source = "../.."
}

// Add your dependencies here
dependencies {
    implementation platform('com.google.firebase:firebase-bom:32.0.0') // Adjust version as needed
    implementation 'com.google.firebase:firebase-analytics-ktx'
    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation 'com.google.android.material:material:1.8.0'
    // Add other dependencies as needed
}
